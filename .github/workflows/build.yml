name: Build (compile verification)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -list

      # Compile-verification only: no signing, no archive, no .app install.
      # The scheme name matches the SPM executable target/product name.
      - name: Build for iOS (unsigned)
        run: >
          xcodebuild build
          -scheme MaqamTrainer
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
